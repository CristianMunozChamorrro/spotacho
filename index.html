<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>SpoTacho</title>
<meta name="theme-color" content="#0d0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SpoTacho">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0d0d10; --bg2:#17171c; --bg3:#222229; --txt:#f4f4f6; --mut:#9a9aa6;
  --acc:#ff7a45; --acc2:#ffb347; --ok:#4cd98a; --danger:#ff5a6a;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{width:24px;height:24px;fill:currentColor;display:block}
.hidden{display:none!important}

/* Layout */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{padding:calc(var(--st) + 14px) 18px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:28px;font-weight:800;letter-spacing:-.5px;flex:1}
header h1 span{color:var(--acc)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg2)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 170px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(13,13,16,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid #ffffff12;padding-bottom:var(--sb);z-index:20}
nav.tabs button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut)}
nav.tabs button.on{color:var(--txt)}
nav.tabs button.on svg{color:var(--acc)}

/* Search */
.searchbox{position:sticky;top:0;background:var(--bg);padding:4px 0 12px;z-index:5}
.searchbox form{display:flex;align-items:center;gap:8px;background:var(--bg2);border-radius:12px;padding:0 12px}
.searchbox svg{color:var(--mut);width:20px;height:20px}
.searchbox input{flex:1;border:0;background:none;padding:13px 0;outline:none;-webkit-user-select:text;user-select:text}
.section-t{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:14px 0 8px;font-weight:600}
.empty{color:var(--mut);text-align:center;padding:50px 20px;font-size:15px}
.empty b{display:block;color:var(--txt);font-size:18px;margin-bottom:6px}

/* Track rows */
.row{display:flex;align-items:center;gap:12px;padding:7px 0;border-radius:10px}
.row:active{background:var(--bg2)}
.art{width:50px;height:50px;border-radius:7px;background:var(--bg3) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--mut)}
.art svg{width:22px;height:22px}
.meta{flex:1;min-width:0}
.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.row.playing .t{color:var(--acc)}
.a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:13px;display:flex;align-items:center;gap:5px}
.a .dl{width:13px;height:13px;color:var(--ok);flex:none}
.row .act{width:38px;height:38px;display:grid;place-items:center;color:var(--mut);border-radius:50%}
.row .act:active{background:var(--bg3)}

/* Library */
.pl-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.pl-card{background:var(--bg2);border-radius:14px;padding:10px;text-align:left}
.pl-card:active{transform:scale(.97)}
.pl-cover{aspect-ratio:1;border-radius:9px;background:linear-gradient(135deg,var(--acc),#c2185b);display:grid;grid-template-columns:1fr 1fr;overflow:hidden;margin-bottom:8px}
.pl-cover.single{grid-template-columns:1fr}
.pl-cover div{background:center/cover no-repeat}
.pl-cover .ph{display:grid;place-items:center;grid-column:1/-1}
.pl-cover .ph svg{width:46px;height:46px;color:#fff9}
.pl-card .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-card .c{font-size:12px;color:var(--mut)}
.pl-card.new .pl-cover{background:var(--bg3)}
.pl-card.new .pl-cover svg{color:var(--acc)}

/* Playlist detail */
.pl-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 12px}
.pl-head .pl-cover{width:180px;box-shadow:0 18px 40px #0008}
.pl-head h2{font-size:24px;margin-top:6px}
.pl-head p{color:var(--mut);font-size:13px;margin-top:2px}
.pl-actions{display:flex;align-items:center;gap:10px;margin:12px 0 6px}
.pill{display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600}
.pill svg{width:18px;height:18px}
.pill.on{color:var(--ok)}
.big-play{margin-left:auto;width:54px;height:54px;border-radius:50%;background:var(--acc);color:#111;display:grid;place-items:center;box-shadow:0 6px 18px #ff7a4566}
.big-play svg{width:28px;height:28px}
.spacer{flex:1}

/* Mini player */
#mini{position:fixed;left:8px;right:8px;bottom:calc(var(--sb) + 60px);background:#2a2430;border-radius:12px;display:flex;align-items:center;gap:10px;padding:7px 8px 9px;z-index:19;box-shadow:0 8px 24px #0009;overflow:hidden}
#mini .art{width:42px;height:42px;border-radius:6px}
#mini .bar{position:absolute;left:10px;right:10px;bottom:3px;height:2px;background:#ffffff22;border-radius:2px}
#mini .bar i{display:block;height:100%;width:0;background:var(--txt);border-radius:2px}
#mini button.pp{width:40px;height:40px;display:grid;place-items:center}

/* Full player */
#player{position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,var(--pc,#5a3a2e) 0%,var(--bg) 75%);display:flex;flex-direction:column;padding:calc(var(--st) + 10px) 26px calc(var(--sb) + 26px);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#player.open{transform:none}
#player .top{display:flex;align-items:center;justify-content:space-between}
#player .top .ctx{font-size:12px;text-align:center;flex:1;color:#fffc}
#player .top .ctx b{display:block;font-size:14px;color:#fff}
#player .bigart{width:100%;aspect-ratio:1;border-radius:12px;background:var(--bg3) center/cover no-repeat;margin:auto 0;box-shadow:0 24px 60px #0009;display:grid;place-items:center}
#player .bigart svg{width:90px;height:90px;color:var(--mut)}
#player .info{display:flex;align-items:center;gap:10px;margin-top:22px}
#player .info .meta .t{font-size:22px;font-weight:700}
#player .info .meta .a{font-size:16px}
#seek{width:100%;margin-top:18px;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:linear-gradient(90deg,#fff var(--p,0%),#ffffff33 var(--p,0%));outline:none}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;font-size:12px;color:#fffa;margin-top:6px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.ctrls button{width:52px;height:52px;display:grid;place-items:center;color:#fff}
.ctrls button.sm{color:#fff9}
.ctrls button.sm.on{color:var(--acc)}
.ctrls button svg{width:34px;height:34px}
.ctrls button.sm svg{width:24px;height:24px}
.ctrls .main{width:72px;height:72px;border-radius:50%;background:#fff;color:#111}
.ctrls .main svg{width:36px;height:36px}

/* Sheet */
#veil{position:fixed;inset:0;background:#0008;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg2);border-radius:18px 18px 0 0;padding:10px 18px calc(var(--sb) + 18px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:75vh;overflow-y:auto}
#sheet.on{transform:none}
#sheet .grab{width:38px;height:5px;border-radius:3px;background:#ffffff30;margin:0 auto 12px}
#sheet h3{font-size:17px;margin-bottom:6px}
#sheet .opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;text-align:left;border-bottom:1px solid #ffffff0d}
#sheet .opt:last-child{border:0}
#sheet .opt .ic{width:42px;height:42px;border-radius:8px;background:var(--bg3);display:grid;place-items:center;flex:none}
#sheet .opt.accent .ic{background:var(--acc);color:#111}
#sheet .opt.danger{color:var(--danger)}

/* Toast */
#toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translate(-50%,-150%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;transition:transform .25s;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
.spin{width:22px;height:22px;border:3px solid #ffffff22;border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.offline-badge{font-size:11px;background:var(--bg3);color:var(--mut);padding:4px 8px;border-radius:999px}
.src{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;flex:none;letter-spacing:.02em}
.src.yt{background:#ff0033;color:#fff}
.src.au{background:#7e1bcc;color:#fff}
.src.lo{background:#3a7bd5;color:#fff}
#player .bigart{position:relative;overflow:hidden}
#pArtImg{position:absolute;inset:0;background:center/cover no-repeat;display:grid;place-items:center}
#ytWrap{position:absolute;inset:0;background:#000;display:flex;align-items:center;visibility:hidden}
#ytWrap.on{visibility:visible}
#ytWrap iframe{width:100%;aspect-ratio:16/9;height:auto;border:0}
#ytHint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:13px;color:#fffc;pointer-events:none}
.field{width:100%;background:var(--bg3);border:1px solid #ffffff1a;border-radius:10px;padding:12px;margin:8px 0;outline:none;-webkit-user-select:text;user-select:text;font-size:14px}
.btn{display:block;width:100%;background:var(--acc);color:#111;font-weight:700;border-radius:12px;padding:13px;margin-top:6px}
.btn.sec{background:var(--bg3);color:var(--txt)}
.note{font-size:13px;color:var(--mut);margin:6px 0}
.note a{color:var(--acc2)}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   SpoTacho · reproductor de música PWA
   - Catálogo: API pública de Audius (https://docs.audius.org)
   - Archivos propios importados desde el iPhone
   - Persistencia: IndexedDB (metadatos + audio descargado)
   - Segundo plano / pantalla de bloqueo / Dynamic Island: <audio> + Media Session API
   ===================================================================== */

const APP_NAME = 'SpoTacho';
const $ = s => document.querySelector(s);
const audio = $('#audio');

/* ---------- IndexedDB ---------- */
const DB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('spotacho', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('blobs'); r.result.createObjectStore('meta'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = async (store, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, mode);
      const req = fn(tx.objectStore(store));
      tx.oncomplete = () => res(req && req.result);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  };
  return {
    get: (s, k) => run(s, 'readonly', st => st.get(k)),
    put: (s, k, v) => run(s, 'readwrite', st => st.put(v, k)),
    del: (s, k) => run(s, 'readwrite', st => st.delete(k)),
    keys: s => run(s, 'readonly', st => st.getAllKeys())
  };
})();

/* ---------- Estado ---------- */
let S = { tracks: {}, playlists: [], plCounter: 0, shuffle: false, repeat: false };
const downloaded = new Set();      // ids con audio guardado en el dispositivo
const artUrls = new Map();         // id -> objectURL de carátula offline
let saveTimer;
const save = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => DB.put('meta', 'state', S).catch(console.error), 150); };

/* ---------- Utilidades ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = s => { if (!isFinite(s) || s < 0) s = 0; s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const shuffleArr = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
const icon = id => `<svg><use href="#i-${id}"/></svg>`;
function artOf(t) { return artUrls.get(t.id) || (navigator.onLine ? t.artwork : '') || ''; }
function artStyle(t) { const u = artOf(t); return u ? `style="background-image:url('${esc(u)}')"` : ''; }

/* ---------- Audius API ---------- */
let host = null;
async function audiusHost(force) {
  if (host && !force) return host;
  try {
    const r = await fetch('https://api.audius.co');
    const j = await r.json();
    host = j.data[Math.floor(Math.random() * j.data.length)];
  } catch { host = 'https://discoveryprovider.audius.co'; }
  return host;
}
async function audiusSearch(q, retry = true) {
  const h = await audiusHost();
  try {
    const r = await fetch(`${h}/v1/tracks/search?query=${encodeURIComponent(q)}&app_name=${APP_NAME}`);
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    return (j.data || []).filter(t => t.is_streamable !== false).map(t => ({
      id: 'au_' + t.id, aid: t.id, source: 'audius',
      title: t.title, artist: t.user?.name || 'Desconocido',
      artwork: t.artwork?.['480x480'] || t.artwork?.['150x150'] || '',
      duration: t.duration || 0
    }));
  } catch (e) {
    if (retry) { await audiusHost(true); return audiusSearch(q, false); }
    throw e;
  }
}
const streamUrl = async t => `${await audiusHost()}/v1/tracks/${t.aid}/stream?app_name=${APP_NAME}`;

/* ---------- YouTube Data API v3 (búsqueda) ---------- */
// Cuota gratuita: 10.000 unidades/día. search.list = 100 u. y videos.list = 1 u. → ~100 búsquedas/día.
const ytCache = new Map();
const decodeHTML = s => new DOMParser().parseFromString(s, 'text/html').documentElement.textContent;
const isoDur = s => { const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(s || ''); return m ? (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0) : 0; };
async function youtubeSearch(q) {
  const key = S.ytKey; if (!key) return [];
  if (ytCache.has(q)) return ytCache.get(q);
  const base = 'https://www.googleapis.com/youtube/v3';
  const r = await fetch(`${base}/search?part=snippet&type=video&videoEmbeddable=true&videoCategoryId=10&maxResults=15&q=${encodeURIComponent(q)}&key=${encodeURIComponent(key)}`);
  const j = await r.json();
  if (!r.ok) {
    const reason = j.error?.errors?.[0]?.reason || '';
    const err = new Error(reason || r.status);
    err.yt = reason === 'quotaExceeded' ? 'Has agotado las búsquedas de YouTube de hoy (se renuevan a las 9:00)'
           : /key|forbidden|API_KEY/i.test(reason + (j.error?.message || '')) ? 'Clave de YouTube no válida. Revísala en Ajustes ⚙'
           : 'Error al buscar en YouTube';
    throw err;
  }
  const items = (j.items || []).filter(i => i.id?.videoId);
  const durs = {};
  if (items.length) {
    try {
      const d = await (await fetch(`${base}/videos?part=contentDetails&id=${items.map(i => i.id.videoId).join(',')}&key=${encodeURIComponent(key)}`)).json();
      (d.items || []).forEach(v => durs[v.id] = isoDur(v.contentDetails?.duration));
    } catch {}
  }
  const res = items.map(i => ({
    id: 'yt_' + i.id.videoId, vid: i.id.videoId, source: 'youtube',
    title: decodeHTML(i.snippet.title),
    artist: decodeHTML(i.snippet.channelTitle).replace(/ - Topic$/, '').replace(/VEVO$/, ''),
    artwork: i.snippet.thumbnails?.high?.url || i.snippet.thumbnails?.default?.url || '',
    duration: durs[i.id.videoId] || 0
  }));
  ytCache.set(q, res);
  return res;
}

/* ---------- YouTube IFrame Player (reproducción oficial) ---------- */
let yt = null, ytReady = null, ytTimer = null, ytHintT = null;
function loadYT() {
  if (ytReady) return ytReady;
  ytReady = new Promise((res, rej) => {
    window.onYouTubeIframeAPIReady = () => {
      yt = new YT.Player('ytHost', {
        width: '100%', height: '100%',
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 1, fs: 0 },
        events: {
          onReady: () => res(yt),
          onStateChange: e => {
            if (e.data === YT.PlayerState.ENDED) next(true);
            if (e.data === YT.PlayerState.PLAYING) { $('#ytHint').classList.add('hidden'); clearTimeout(ytHintT); }
            ytPaused = e.data !== YT.PlayerState.PLAYING && e.data !== YT.PlayerState.BUFFERING;
            updatePlayState();
          },
          onError: () => { toast('Este vídeo no se puede reproducir aquí, paso a la siguiente'); setTimeout(() => next(true), 800); }
        }
      });
    };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => { ytReady = null; rej(new Error('No se pudo cargar YouTube')); };
    document.head.appendChild(s);
  });
  return ytReady;
}
let ytPaused = true;

/* ---------- Motor de reproducción unificado (audio HTML5 o YouTube) ---------- */
const isYT = () => current?.source === 'youtube';
const Engine = {
  play() { if (isYT()) yt?.playVideo(); else audio.play().catch(() => {}); },
  pause() { if (isYT()) yt?.pauseVideo(); else audio.pause(); },
  paused() { return isYT() ? ytPaused : audio.paused; },
  time() { return isYT() ? (yt?.getCurrentTime?.() || 0) : audio.currentTime; },
  dur() { return isYT() ? (yt?.getDuration?.() || current?.duration || 0) : (audio.duration || current?.duration || 0); },
  seek(s) { if (isYT()) yt?.seekTo(s, true); else audio.currentTime = s; }
};

/* ---------- Descargas (offline) ---------- */
async function downloadTrack(t) {
  if (downloaded.has(t.id) || t.source !== 'audius') return;
  const r = await fetch(await streamUrl(t));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  await DB.put('blobs', t.id, await r.blob());
  downloaded.add(t.id);
  if (t.artwork) {
    try {
      const a = await fetch(t.artwork);
      if (a.ok) { const b = await a.blob(); await DB.put('blobs', t.id + '_art', b); artUrls.set(t.id, URL.createObjectURL(b)); }
    } catch {}
  }
}
async function removeDownload(t) {
  if (t.source === 'local') return; // los archivos propios solo existen en el dispositivo
  await DB.del('blobs', t.id); await DB.del('blobs', t.id + '_art').catch(() => {});
  downloaded.delete(t.id); artUrls.delete(t.id);
}
const isOffline = t => downloaded.has(t.id);

/* ---------- Archivos propios ---------- */
function readID3(buf) {
  const v = new DataView(buf), out = {};
  if (buf.byteLength < 10 || String.fromCharCode(v.getUint8(0), v.getUint8(1), v.getUint8(2)) !== 'ID3') return out;
  const ver = v.getUint8(3);
  const syncsafe = o => (v.getUint8(o) << 21) | (v.getUint8(o + 1) << 14) | (v.getUint8(o + 2) << 7) | v.getUint8(o + 3);
  const end = Math.min(10 + syncsafe(6), buf.byteLength);
  let o = 10;
  while (o + 10 < end) {
    const id = String.fromCharCode(v.getUint8(o), v.getUint8(o + 1), v.getUint8(o + 2), v.getUint8(o + 3));
    if (!/^[A-Z0-9]{4}$/.test(id)) break;
    const size = ver === 4 ? syncsafe(o + 4) : v.getUint32(o + 4);
    const body = new Uint8Array(buf, o + 10, Math.min(size, end - o - 10));
    if (id === 'TIT2' || id === 'TPE1') {
      const enc = body[0], data = body.slice(1);
      const dec = enc === 1 ? 'utf-16' : enc === 2 ? 'utf-16be' : enc === 3 ? 'utf-8' : 'latin1';
      const txt = new TextDecoder(dec).decode(data).replace(/\0/g, '').trim();
      if (txt) out[id === 'TIT2' ? 'title' : 'artist'] = txt;
    }
    o += 10 + size;
  }
  return out;
}
async function importFiles(files) {
  let n = 0;
  for (const f of files) {
    try {
      const head = await f.slice(0, 256 * 1024).arrayBuffer();
      const tag = readID3(head);
      const base = f.name.replace(/\.[^.]+$/, '');
      const [fa, ft] = base.includes(' - ') ? base.split(' - ', 2) : [null, base];
      const t = { id: uid('lo_'), source: 'local', title: tag.title || ft, artist: tag.artist || fa || 'Mis archivos', artwork: '', duration: 0 };
      await DB.put('blobs', t.id, f);
      S.tracks[t.id] = t; downloaded.add(t.id); n++;
    } catch (e) { console.error(e); }
  }
  save(); toast(n ? `${n} canción${n > 1 ? 'es' : ''} importada${n > 1 ? 's' : ''}` : 'No se pudo importar');
  render();
}
$('#fileIn').addEventListener('change', e => { importFiles([...e.target.files]); e.target.value = ''; });

/* ---------- Playlists ---------- */
function newPlaylist(name) {
  S.plCounter++;
  const p = { id: uid('pl_'), name: name || `Mi playlist nº ${S.plCounter}`, trackIds: [], offline: false };
  S.playlists.push(p); save(); return p;
}
function addToPlaylist(p, t) {
  S.tracks[t.id] = { ...(S.tracks[t.id] || {}), ...t };
  if (p.trackIds.includes(t.id)) { toast(`Ya está en «${p.name}»`); return; }
  p.trackIds.push(t.id); save();
  toast(`Añadida a «${p.name}»`);
  if (p.offline && navigator.onLine) downloadTrack(t).then(render).catch(() => {});
}
const plTracks = p => p.trackIds.map(id => S.tracks[id]).filter(Boolean);
function coverHTML(p) {

  if (arts.length >= 4) return `<div class="pl-cover">${arts.slice(0, 4).map(a => `<div style="background-image:url('${esc(a)}')"></div>`).join('')}</div>`;

/* ---------- Reproductor ---------- */
let queue = [], qi = -1, ctxName = '', curUrl = null, current = null;
let baseQueue = [];   // orden original (para desactivar aleatorio)

async function srcFor(t) {
  if (curUrl) { URL.revokeObjectURL(curUrl); curUrl = null; }
  const blob = downloaded.has(t.id) ? await DB.get('blobs', t.id) : null;
  if (blob) return (curUrl = URL.createObjectURL(blob));
  if (t.source === 'audius' && navigator.onLine) return streamUrl(t);
  return null;
}
const canPlay = t => t && (downloaded.has(t.id) || navigator.onLine);
async function playQueue(ids, index, name, shuffled = false) {
  baseQueue = ids.slice();
  S.shuffle = shuffled; save();
  if (shuffled) {
    const first = ids[index];
    queue = [first, ...shuffleArr(ids.filter((_, i) => i !== index))]; qi = 0;
  } else { queue = ids.slice(); qi = index; }
  ctxName = name;
  await loadCurrent(true);
}
// Importante (iOS): para YouTube no se hace ningún "await" antes de loadVideoById,
// así la orden de reproducir sigue dentro del toque del usuario.
async function loadCurrent(autoplay, tries = 0) {
  let t = S.tracks[queue[qi]];
  if (!t) return;
  if (!canPlay(t)) {
    if (tries < queue.length - 1) { toast('Sin conexión: saltando canciones no descargadas'); qi = (qi + 1) % queue.length; return loadCurrent(autoplay, tries + 1); }
    toast('No hay canciones descargadas para escuchar sin conexión'); return;
  }
  const prevWasYT = isYT();
  if (t.source === 'youtube') {
    audio.pause();
    current = t; ytPaused = !autoplay;
    $('#ytWrap').classList.add('on');
    updateMediaSession(t); updatePlayerUI(); render();
    openPlayer();                      // el vídeo de YouTube debe estar visible
    try {
      const p = yt || await loadYT();
      if (current !== t) return;
      autoplay ? p.loadVideoById(t.vid) : p.cueVideoById(t.vid);
      clearTimeout(ytHintT);
      ytHintT = setTimeout(() => { if (current === t && ytPaused) $('#ytHint').classList.remove('hidden'); }, 2500);
    } catch (e) { toast('No se pudo cargar YouTube'); }
    startYTTimer();
    return;
  }
  if (prevWasYT) { yt?.stopVideo(); stopYTTimer(); }
  $('#ytWrap').classList.remove('on'); $('#ytHint').classList.add('hidden');
  const src = await srcFor(t);
  if (!src) { qi = (qi + 1) % queue.length; return tries < queue.length - 1 ? loadCurrent(autoplay, tries + 1) : undefined; }
  current = t;
  audio.src = src;
  updateMediaSession(t);
  updatePlayerUI();
  render();
  if (autoplay) audio.play().catch(e => { console.warn(e); });
}
async function playTrackNow(t) {         // búsqueda: reproducir al instante
  S.tracks[t.id] = { ...(S.tracks[t.id] || {}), ...t };
  await playQueue([t.id], 0, 'Búsqueda');
}
function next(auto) {
  if (!queue.length) return;
  if (qi < queue.length - 1) qi++;
  else if (S.repeat || !auto) qi = 0;
  else { Engine.pause(); Engine.seek(0); return; }
  loadCurrent(true);
}
function prev() {
  if (Engine.time() > 3 || qi === 0) { Engine.seek(0); return; }
  qi--; loadCurrent(true);
}
function togglePlay() { if (!current) return; Engine.paused() ? Engine.play() : Engine.pause(); }
function setShuffle(on) {
  S.shuffle = on; save();
  if (!current) return;
  if (on) queue = [current.id, ...shuffleArr(baseQueue.filter(id => id !== current.id))], qi = 0;
  else { queue = baseQueue.slice(); qi = Math.max(0, queue.indexOf(current.id)); }
  updatePlayerUI();
}

audio.addEventListener('ended', () => next(true));
audio.addEventListener('play', updatePlayState);
audio.addEventListener('pause', updatePlayState);
audio.addEventListener('error', () => { if (current && !isYT() && audio.getAttribute('src')) { toast('No se pudo reproducir, paso a la siguiente'); setTimeout(() => next(true), 600); } });
let lastPos = 0;
function onTime() {
  const d = Engine.dur(), c = Engine.time();
  const pct = d ? Math.min(100, (c / d) * 100) : 0;
  $('#miniBar').style.width = pct + '%';
  if (!seeking) { $('#seek').value = pct * 10; $('#seek').style.setProperty('--p', pct + '%'); $('#tCur').textContent = fmt(c); }
  $('#tDur').textContent = fmt(d);
  if (Math.abs(c - lastPos) > 4 || c < lastPos) { lastPos = c; setPositionState(); }
}
audio.addEventListener('timeupdate', onTime);
function startYTTimer() { stopYTTimer(); ytTimer = setInterval(onTime, 500); }
function stopYTTimer() { clearInterval(ytTimer); ytTimer = null; }
audio.addEventListener('loadedmetadata', () => {
  if (current && current.source === 'local' && !current.duration && isFinite(audio.duration)) { current.duration = audio.duration; save(); }
  setPositionState();
});

/* ---------- Media Session: pantalla de bloqueo + Dynamic Island ---------- */
function updateMediaSession(t) {
  if (!('mediaSession' in navigator)) return;
  const a = artOf(t);
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t.title, artist: t.artist, album: ctxName || APP_NAME,
    artwork: a ? [{ src: a, sizes: '480x480', type: 'image/jpeg' }]
               : [{ src: new URL('icon-512.png', location.href).href, sizes: '512x512', type: 'image/png' }]
  });
}
function setPositionState() {
  if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  const d = Engine.dur();
  if (!isFinite(d) || d <= 0) return;
  try { navigator.mediaSession.setPositionState({ duration: d, position: Math.min(Engine.time(), d), playbackRate: 1 }); } catch {}
}
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  const h = (a, f) => { try { ms.setActionHandler(a, f); } catch {} };
  h('play', () => Engine.play());
  h('pause', () => Engine.pause());
  h('previoustrack', prev);
  h('nexttrack', () => next(false));
  h('seekto', d => { Engine.seek(d.seekTime); setPositionState(); });
  // No se registran seekbackward/seekforward: en iOS sustituirían a los botones anterior/siguiente.
}
// Al volver a la app (p. ej. tocando la Dynamic Island) se abre directamente la canción en reproducción
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && current && !Engine.paused()) openPlayer();
});

/* ---------- UI del reproductor ---------- */

  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
}
function updatePlayerUI() {

  $('#mini').classList.remove('hidden');
  const a = artOf(t);

function render() {
  const m = $('#main');
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === (view.name === 'playlist' || view.name === 'local' ? 'library' : view.name)));
  $('#backBtn').classList.toggle('hidden', !(view.name === 'playlist' || view.name === 'local'));
  $('#offBadge').classList.toggle('hidden', navigator.onLine);

  if (view.name === 'search') {
    $('#title').innerHTML = 'Spo<span>Tacho</span>';
    const locals = lastQuery ? Object.values(S.tracks).filter(t => t.source === 'local' && (t.title + ' ' + t.artist).toLowerCase().includes(lastQuery.toLowerCase())) : [];
    const list = [...locals, ...ytResults, ...auResults];
    const section = (title, arr, off) => arr.length ? `<div class="section-t">${title}</div>` + arr.map((t, i) => trackRow(t, i + off, 'search')).join('') : '';
    const noKey = !S.ytKey ? `<div class="note" style="text-align:center;margin-top:14px">Para buscar en todo el catálogo de YouTube, añade tu clave en <a href="#" id="goSet">Ajustes ⚙</a>.</div>` : '';
    m.innerHTML = `<div class="searchbox"><form id="sForm"><svg><use href="#i-search"/></svg>
        <input id="sIn" type="search" placeholder="¿Qué quieres escuchar?" enterkeyhint="search" autocomplete="off" value="${esc(lastQuery)}"></form></div>
      ${searching ? '<div class="spin"></div>'
        : !lastQuery ? `<div class="empty"><b>Busca canciones o artistas</b>Toca una canción para escucharla al instante o pulsa + para añadirla a una playlist.</div>${noKey}`
        : !list.length ? `<div class="empty"><b>Sin resultados</b>${navigator.onLine ? 'Prueba con otra búsqueda.' : 'Estás sin conexión: solo puedes buscar en tus archivos.'}</div>${noKey}`
        : section('Tus archivos', locals, 0)
          + section('YouTube', ytResults, locals.length)
          + section('Audius · descargables', auResults, locals.length + ytResults.length) + noKey}`;
    const gs = $('#goSet'); if (gs) gs.onclick = e => { e.preventDefault(); sheetSettings(); };
    $('#sForm').onsubmit = e => { e.preventDefault(); const q = $('#sIn').value.trim(); $('#sIn').blur(); doSearch(q); };
    bindRows(m, list, 'search');
  }

  if (view.name === 'library') {
    $('#title').textContent = 'Tu biblioteca';
    const nLocal = Object.values(S.tracks).filter(t => t.source === 'local').length;
    m.innerHTML = `<div class="pl-grid">
        <button class="pl-card new" id="newPl"><div class="pl-cover"><div class="ph">${icon('plus')}</div></div><div class="n">Nueva playlist</div><div class="c">Crear vacía</div></button>
        <button class="pl-card" id="localCard"><div class="pl-cover" style="background:linear-gradient(135deg,#3a7bd5,#00d2ff)"><div class="ph">${icon('upload')}</div></div><div class="n">Mis archivos</div><div class="c">${nLocal} canciones</div></button>
        ${S.playlists.map((p, i) => `<button class="pl-card" data-i="${i}">${coverHTML(p)}<div class="n">${esc(p.name)}</div><div class="c">${p.offline ? '✓ Descargada · ' : ''}${p.trackIds.length} canciones</div></button>`).join('')}
      </div>`;
    $('#newPl').onclick = () => { const p = newPlaylist(); go('playlist', { id: p.id }); };
    $('#localCard').onclick = () => go('local');
    m.querySelectorAll('.pl-card[data-i]').forEach(c => c.onclick = () => go('playlist', { id: S.playlists[+c.dataset.i].id }));
  }

  if (view.name === 'playlist') {
    const p = S.playlists.find(x => x.id === view.id); if (!p) return go('library');
    const ts = plTracks(p);
    const nDl = ts.filter(isOffline).length;
    $('#title').textContent = '';
    m.innerHTML = `<div class="pl-head">${coverHTML(p)}<h2>${esc(p.name)}</h2><p>${ts.length} canciones${ts.length ? ` · ${nDl} descargadas` : ''}${ts.some(t => t.source === 'youtube') ? ` · ${ts.filter(t => t.source === 'youtube').length} de YouTube (solo con conexión)` : ''}</p></div>
      <div class="pl-actions">
        <button class="pill ${p.offline ? 'on' : ''}" id="dlBtn">${icon(p.offline ? 'check' : 'down')}<span>${p.offline ? 'Descargada' : 'Descargar'}</span></button>
        <button class="pill" id="optBtn" aria-label="Opciones">${icon('more')}</button>
        <span class="spacer"></span>
        <button class="pill" id="shufBtn" aria-label="Aleatorio">${icon('shuffle')}</button>
        <button class="big-play" id="playBtn" aria-label="Reproducir aleatoriamente">${icon('play')}</button>
      </div>
      ${ts.length ? ts.map((t, i) => trackRow(t, i, 'pl')).join('') : `<div class="empty"><b>Playlist vacía</b>Busca canciones y pulsa + para añadirlas aquí.</div>`}`;
    const ids = ts.map(t => t.id);
    $('#playBtn').onclick = $('#shufBtn').onclick = () => ids.length && playQueue(ids, Math.floor(Math.random() * ids.length), p.name, true);
    $('#optBtn').onclick = () => sheetPlaylist(p);
    $('#dlBtn').onclick = () => toggleOffline(p);
    bindRows(m, ts, 'pl', p);
  }

  if (view.name === 'local') {
    const ts = Object.values(S.tracks).filter(t => t.source === 'local');
    $('#title').textContent = 'Mis archivos';
    m.innerHTML = `<div class="pl-actions"><button class="pill" id="impBtn">${icon('upload')}<span>Importar canciones</span></button><span class="spacer"></span>
        ${ts.length ? `<button class="big-play" id="playBtn">${icon('play')}</button>` : ''}</div>
      ${ts.length ? ts.map((t, i) => trackRow(t, i, 'local')).join('') : `<div class="empty"><b>Sin archivos</b>Importa MP3/M4A desde la app Archivos o iCloud Drive. Se guardan en el iPhone y funcionan sin conexión.</div>`}`;
    $('#impBtn').onclick = () => $('#fileIn').click();
    if (ts.length) $('#playBtn').onclick = () => playQueue(ts.map(t => t.id), Math.floor(Math.random() * ts.length), 'Mis archivos', true);
    bindRows(m, ts, 'local');
  }
}

function bindRows(root, list, ctx, p) {
  root.querySelectorAll('.row').forEach(r => r.onclick = e => {
    const t = list[+r.dataset.i]; if (!t) return;
    if (e.target.closest('[data-add]')) return sheetAddTo(t);
    if (e.target.closest('[data-more]')) return sheetTrack(t, p || null);
    if (ctx === 'search') playTrackNow(t);
    else playQueue(list.map(x => x.id), +r.dataset.i, p ? p.name : 'Mis archivos', false);
  });
}

async function doSearch(q) {
  lastQuery = q; ytResults = []; auResults = [];
  if (!q || !navigator.onLine) return render();
  searching = true; render();
  // Se consulta a las dos fuentes en paralelo; si una falla, se muestran los resultados de la otra
  const [y, a] = await Promise.allSettled([youtubeSearch(q), audiusSearch(q)]);
  if (y.status === 'fulfilled') ytResults = y.value; else { console.error(y.reason); toast(y.reason?.yt || 'Error al buscar en YouTube'); }
  if (a.status === 'fulfilled') auResults = a.value; else console.error(a.reason);
  if (y.status === 'rejected' && a.status === 'rejected') toast('Error al buscar. Revisa la conexión.');
  searching = false; render();
}

/* ---------- Ajustes ---------- */
function sheetSettings() {
  openSheet(`<h3>Ajustes</h3>
    <p class="note"><b style="color:var(--txt)">Clave de la API de YouTube</b><br>Sirve para buscar en el catálogo completo de YouTube. Es gratuita y se crea en Google Cloud Console (pasos en el README).</p>
    <input class="field" id="ytKeyIn" placeholder="AIza…" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(S.ytKey || '')}">
    <button class="btn" id="saveKey">Guardar</button>
    ${S.ytKey ? '<button class="btn sec" id="delKey">Quitar clave</button>' : ''}
    <p class="note" style="margin-top:14px">Las canciones de YouTube se escuchan con conexión y con la app abierta. Para escuchar sin internet o con la pantalla bloqueada, usa canciones de Audius descargadas o tus propios MP3.</p>`);
  $('#sheet').onclick = async e => {
    if (e.target.id === 'saveKey') {
      const k = $('#ytKeyIn').value.trim();
      if (!k) return;
      S.ytKey = k; ytCache.clear();
      e.target.textContent = 'Comprobando…';
      try { await youtubeSearch('test'); ytCache.clear(); save(); closeSheet(); toast('Clave guardada ✓'); loadYT().catch(() => {}); }
      catch (err) { S.ytKey = ''; e.target.textContent = 'Guardar'; toast(err.yt || 'No se pudo comprobar la clave'); }
    }
    if (e.target.id === 'delKey') { S.ytKey = ''; save(); closeSheet(); toast('Clave eliminada'); render(); }
  };
}
$('#setBtn').onclick = sheetSettings;

async function toggleOffline(p) {
  if (p.offline) {
    if (!confirm('¿Quitar las descargas de esta playlist?')) return;
    const keep = new Set(S.playlists.filter(x => x !== p && x.offline).flatMap(x => x.trackIds));
    for (const t of plTracks(p)) if (!keep.has(t.id)) await removeDownload(t);
    p.offline = false; save(); render(); return;
  }
  if (!navigator.onLine) return toast('Necesitas conexión para descargar');
  p.offline = true; save();
  const ts = plTracks(p).filter(t => !isOffline(t) && t.source === 'audius');
  let ok = 0, fail = 0;
  for (const t of ts) {
    const btn = $('#dlBtn span'); if (btn) btn.textContent = `Descargando ${ok + fail + 1}/${ts.length}`;
    try { await downloadTrack(t); ok++; } catch (e) { console.error(e); fail++; }
  }
  const nYT = plTracks(p).filter(t => t.source === 'youtube').length;
  toast(fail ? `${ok} descargadas, ${fail} con error` : nYT ? `Lista ✓ (${nYT} de YouTube no se pueden descargar)` : 'Playlist lista para escuchar sin conexión ✓');
  render();
}

window.addEventListener('online', render);
window.addEventListener('offline', render);

/* ---------- Arranque ---------- */
(async function init() {
  try {
    const st = await DB.get('meta', 'state');
    if (st) S = { ...S, ...st };
    for (const k of await DB.keys('blobs')) {
      if (String(k).endsWith('_art')) {
        const b = await DB.get('blobs', k); artUrls.set(String(k).slice(0, -4), URL.createObjectURL(b));
      } else downloaded.add(k);
    }
  } catch (e) { console.error(e); toast('No se pudo cargar la biblioteca'); }
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  render();
  if (S.ytKey && navigator.onLine) loadYT().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(console.error);
})();
</script>
